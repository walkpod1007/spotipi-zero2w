<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotiPi WiFi 設定</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1DB954 0%, #191414 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px;
      max-width: 400px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .logo { text-align: center; margin-bottom: 24px; font-size: 48px; }
    h1 { color: #191414; margin-bottom: 8px; font-size: 26px; }
    p.sub { color: #666; margin-bottom: 28px; font-size: 14px; }
    label { display: block; color: #333; font-weight: 600; margin-bottom: 6px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 14px; border: 2px solid #e0e0e0;
      border-radius: 8px; font-size: 16px; margin-bottom: 20px;
      transition: border-color .2s;
    }
    input:focus { outline: none; border-color: #1DB954; }
    button {
      width: 100%; padding: 16px; background: #1DB954;
      color: #fff; border: none; border-radius: 8px;
      font-size: 18px; font-weight: 600; cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #1ed760; }
    .msg {
      padding: 12px; border-radius: 8px; margin-bottom: 16px;
      display: none; font-size: 14px;
    }
    .msg.error { background: #ffeaea; color: #c0392b; border: 1px solid #f5c6cb; }
    .msg.success { background: #eaffea; color: #27ae60; border: 1px solid #c3e6cb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎵</div>
    <h1>SpotiPi WiFi 設定</h1>
    <p class="sub">請輸入您的 WiFi 資訊與 Spotify 認證，設定完成後系統將自動重新啟動。</p>

    <div class="msg error" id="err"></div>
    <div class="msg success" id="ok">設定成功！系統正在重新啟動，請稍候...</div>

    <form id="form">
      <label for="ssid">WiFi 名稱 (SSID)</label>
      <input type="text" id="ssid" name="ssid" placeholder="您的 WiFi 名稱" required>

      <label for="password">WiFi 密碼</label>
      <input type="password" id="password" name="password" placeholder="至少 8 個字元" required>

      <label for="client_id">Spotify Client ID</label>
      <input type="text" id="client_id" name="client_id" placeholder="32 位英數字串" required>

      <label for="client_secret">Spotify Client Secret</label>
      <input type="password" id="client_secret" name="client_secret" placeholder="32 位英數字串" required>

      <p style="font-size:12px;color:#888;margin-top:-12px;margin-bottom:20px;">
        請先到 <a href="https://developer.spotify.com" target="_blank" style="color:#1DB954;">developer.spotify.com</a> 建立 App，Redirect URI 填 <code style="background:#f5f5f5;padding:2px 4px;border-radius:4px;">http://spotipi.local:8888/callback</code>
      </p>

      <button type="submit">連接 WiFi 並儲存設定</button>
    </form>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const err = document.getElementById('err');
      const ok  = document.getElementById('ok');
      err.style.display = 'none';

      const body = new URLSearchParams({
        ssid: document.getElementById('ssid').value,
        password: document.getElementById('password').value,
        client_id: document.getElementById('client_id').value,
        client_secret: document.getElementById('client_secret').value
      });

      try {
        const res = await fetch('/connect', { method: 'POST', body });
        const data = await res.json();
        if (data.success) {
          this.style.display = 'none';
          ok.style.display = 'block';
        } else {
          err.textContent = data.error || '設定失敗，請重試';
          err.style.display = 'block';
        }
      } catch {
        err.textContent = '連線錯誤，請重試';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
