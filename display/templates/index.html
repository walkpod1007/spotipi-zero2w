<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotiPi</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    #cover {
      width: 400px; height: 400px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 8px 48px rgba(0,0,0,.8);
      transition: opacity .4s ease, transform .4s ease;
    }

    #cover.fade { opacity: 0; transform: scale(.97); }

    #placeholder {
      width: 400px; height: 400px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: #111;
      flex-direction: column;
      gap: 16px;
    }

    #placeholder img {
      width: 200px; height: 200px;
      border-radius: 12px;
      opacity: .6;
    }

    #nothing-label {
      color: #555;
      font-size: 20px;
      letter-spacing: .05em;
    }

    #track {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 520px;
    }

    #artist {
      color: #aaa;
      font-size: 18px;
      text-align: center;
      max-width: 520px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="container">
    <img id="cover" src="" alt="Album Art" class="hidden">
    <div id="placeholder">
      <img src="/static/placeholder.png" alt="SpotiPi">
      <span id="nothing-label">Nothing Playing</span>
    </div>
    <div id="track" class="hidden"></div>
    <div id="artist" class="hidden"></div>
  </div>

  <script>
    const cover      = document.getElementById('cover');
    const placeholder = document.getElementById('placeholder');
    const trackEl    = document.getElementById('track');
    const artistEl   = document.getElementById('artist');

    let lastTrack = null;
    let lastArt   = null;

    async function update() {
      try {
        const res  = await fetch('/api/current');
        const data = await res.json();

        if (!data.is_playing) {
          if (lastTrack !== null) {
            lastTrack = null; lastArt = null;
            showNothing();
          }
          return;
        }

        const changed = data.track !== lastTrack || data.album_art_url !== lastArt;
        if (!changed) return;

        lastTrack = data.track;
        lastArt   = data.album_art_url;

        trackEl.textContent  = data.track  || '';
        artistEl.textContent = data.artist || '';
        trackEl.classList.remove('hidden');
        artistEl.classList.remove('hidden');
        placeholder.classList.add('hidden');

        if (data.album_art_url) {
          cover.classList.add('fade');
          setTimeout(() => {
            cover.src = data.album_art_url;
            cover.classList.remove('hidden');
            cover.onload = () => cover.classList.remove('fade');
          }, 400);
        } else {
          cover.classList.add('hidden');
        }

      } catch (err) {
        console.warn('poll error', err);
      }
    }

    function showNothing() {
      cover.classList.add('hidden');
      cover.src = '';
      trackEl.classList.add('hidden');
      artistEl.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }

    update();
    setInterval(update, 2000);
  </script>
</body>
</html>
